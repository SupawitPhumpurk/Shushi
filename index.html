<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D GLB Viewer - Shushi</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* กล่องใส่ลิงก์ GitHub / Website */
        #input-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.85);
            padding: 12px 16px;
            border-radius: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        #github-url-input {
            width: 380px;
            padding: 8px 12px;
            border: 1px solid #555;
            border-radius: 6px;
            background: #222;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        #github-url-input:focus {
            border-color: #007bff;
        }

        #load-btn {
            padding: 8px 16px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        #load-btn:hover {
            background: #0056b3;
        }

        #status {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 100;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <!-- ช่องสำหรับกรอกลิงก์ -->
    <div id="input-container">
        <input type="text" id="github-url-input" 
               placeholder="วางลิงก์ .glb หรือ ลิงก์ GitHub Pages..." 
               value="https://supawitphumpurk.github.io/Shushi/Shushi.glb">
        <button id="load-btn">โหลดโมเดล</button>
    </div>

    <div id="status">พร้อมใช้งาน</div>

    <!-- Core Three.js & Loaders -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>

    <!-- Controls & GUI -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DragControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.18"></script>

    <script>
        // 1. Setup Renderer & Scene
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 3, 5);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 2. แสงสว่าง (Lighting)
        const ambientLight = new THREE.AmbientLight(0x404040, 1);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
        directionalLight.position.set(10, 10, 10);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        // ตัวแทนแสง + GUI + Mouse Drag
        const lightHelperMesh = new THREE.Mesh(
            new THREE.SphereGeometry(0.2, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0xffea00, wireframe: true })
        );
        lightHelperMesh.position.copy(directionalLight.position);
        scene.add(lightHelperMesh);

        const gui = new lil.GUI({ title: '⚙️ Controls' });

        const lightFolder = gui.addFolder('PBR Controller');
        lightFolder.add(directionalLight.position, 'x', -10, 10, 0.1).name('Position X').listen();
        lightFolder.add(directionalLight.position, 'y', 0, 15, 0.1).name('Position Y').listen();
        lightFolder.add(directionalLight.position, 'z', -10, 10, 0.1).name('Position Z').listen();
        lightFolder.add(directionalLight, 'intensity', 0, 10, 0.1).name('Intensity');

        const dragControls = new THREE.DragControls([lightHelperMesh], camera, renderer.domElement);
        dragControls.addEventListener('dragstart', () => { controls.enabled = false; });
        dragControls.addEventListener('drag', (event) => { directionalLight.position.copy(event.object.position); });
        dragControls.addEventListener('dragend', () => { controls.enabled = true; });

        // 3. EXR Environment / Skybox
        const exrSkyboxUrl = 'https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/1k/sunset_fairway_1k.exr';
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        new THREE.EXRLoader()
            .setDataType(THREE.UnsignedByteType)
            .load(exrSkyboxUrl, (texture) => {
                const skybox = pmremGenerator.fromEquirectangular(texture).texture;
                scene.background = skybox;
                scene.environment = skybox;
                texture.dispose();
                pmremGenerator.dispose();
            }, undefined, (error) => {
                console.error('Unable to load EXR skybox:', error);
            });

        // 4. พื้น (Floor Plane)
        const texFloor = new THREE.TextureLoader().load('https://sibsansuk.github.io/mossy_cobblestone_diff_1k.jpg');
        const matFloor = new THREE.MeshStandardMaterial({ map: texFloor, side: THREE.DoubleSide });
        const plane = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), matFloor);
        plane.rotation.x = -Math.PI / 2;
        plane.receiveShadow = true;
        scene.add(plane);

        // 5. โหลดโมเดล
        let currentModel = null;
        let charFolder = null;

        const loader = new THREE.GLTFLoader();
        const dracoLoader = new THREE.DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
        loader.setDRACOLoader(dracoLoader);

        const status = document.getElementById('status');

        // ฟังก์ชันแปลง URL จาก GitHub ให้ชี้ไปที่ไฟล์ .glb โดยอัตโนมัติ
        function fixGlbUrl(url) {
            let cleanUrl = url.trim();
            // หากวางลิงก์ GitHub ธรรมดามา ให้แปลงเป็น Raw URL
            if (cleanUrl.includes('github.com') && !cleanUrl.includes('raw.githubusercontent.com')) {
                cleanUrl = cleanUrl.replace('github.com', 'raw.githubusercontent.com').replace('/blob/', '/');
            }
            // หากใส่มาแค่ลิงก์เว็บหลัก https://supawitphumpurk.github.io/Shushi/ ให้เติม /Shushi.glb ให้อัตโนมัติ
            if (cleanUrl.endsWith('/Shushi/') || cleanUrl.endsWith('/Shushi')) {
                cleanUrl = 'https://supawitphumpurk.github.io/Shushi/Shushi.glb';
            }
            return cleanUrl;
        }

        function setupGUI(model) {
            if (charFolder) charFolder.destroy();
            charFolder = gui.addFolder('Model Material');

            const materials = [];
            model.traverse((child) => {
                if (child.isMesh && child.material) {
                    if (Array.isArray(child.material)) materials.push(...child.material);
                    else materials.push(child.material);
                }
            });

            if (materials.length === 0) return;

            const params = {
                color: '#' + (materials[0].color ? materials[0].color.getHexString() : 'ffffff'),
                metalness: materials[0].metalness !== undefined ? materials[0].metalness : 0,
                roughness: materials[0].roughness !== undefined ? materials[0].roughness : 0.5
            };

            charFolder.addColor(params, 'color').name('Base Color').onChange((val) => {
                materials.forEach(mat => { if (mat.color) mat.color.set(val); });
            });
            charFolder.add(params, 'metalness', 0, 1, 0.01).name('Metallic').onChange((val) => {
                materials.forEach(mat => { if ('metalness' in mat) mat.metalness = val; });
            });
            charFolder.add(params, 'roughness', 0, 1, 0.01).name('Roughness').onChange((val) => {
                materials.forEach(mat => { if ('roughness' in mat) mat.roughness = val; });
            });
        }

        function loadModel(url) {
            status.innerText = "กำลังโหลดโมเดล...";
            
            if (currentModel) scene.remove(currentModel);

            const targetUrl = fixGlbUrl(url);

            loader.load(targetUrl, (gltf) => {
                currentModel = gltf.scene;
                currentModel.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                // จัดตำแหน่งให้อยู่กลางพื้นพอดี
                const box = new THREE.Box3().setFromObject(currentModel);
                currentModel.position.set(0, -box.min.y, 0);

                scene.add(currentModel);
                setupGUI(currentModel);
                status.innerText = "โหลดโมเดลสำเร็จ!";
            }, (xhr) => {
                if (xhr.total > 0) {
                    status.innerText = `กำลังโหลด... ${Math.round((xhr.loaded / xhr.total) * 100)}%`;
                }
            }, (error) => {
                console.error(error);
                status.innerText = "เกิดข้อผิดพลาดในการโหลดโมเดล (ตรวจสอบลิงก์อีกครั้ง)";
            });
        }

        // กดปุ่มเพื่อโหลด
        document.getElementById('load-btn').addEventListener('click', () => {
            const url = document.getElementById('github-url-input').value;
            if (url) loadModel(url);
        });

        // โหลดโมเดล Shushi.glb เป็นค่าเริ่มต้นทันที
        loadModel(document.getElementById('github-url-input').value);

        // 6. Loop Render
        function animate() {
            controls.update();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
