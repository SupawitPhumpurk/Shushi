<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D GLB Viewer - Shushi</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; font-family: sans-serif; }
        #input-container { position: absolute; top: 20px; left: 20px; z-index: 100; background: rgba(0,0,0,0.85); padding: 12px 16px; border-radius: 10px; display: flex; gap: 10px; }
        #github-url-input { width: 380px; padding: 8px 12px; border: 1px solid #555; border-radius: 6px; background: #222; color: #fff; font-size: 14px; outline: none; }
        #github-url-input:focus { border-color: #007bff; }
        #load-btn { padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
        #load-btn:hover { background: #0056b3; }
        #status { position: absolute; bottom: 20px; left: 20px; z-index: 100; color: #fff; background: rgba(0,0,0,0.7); padding: 6px 12px; border-radius: 4px; font-size: 13px; }
    </style>
</head>
<body>

    <!-- ช่องสำหรับกรอกลิงก์ -->
    <div id="input-container">
        <input type="text" id="github-url-input" 
               placeholder="วางลิงก์ .glb ตรงนี้..." 
               value="https://supawitphumpurk.github.io/Shushi/Shushi.glb">
        <button id="load-btn">โหลดโมเดล</button>
    </div>
    <div id="status">กำลังโหลดโมเดล...</div>

    <!-- Core Three.js & Loaders -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>

    <script>
        // 1. Setup Scene & Camera
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a); // สีพื้นหลังฉาก (เรียบๆ)

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 1000);
        camera.position.set(0, 1.5, 3);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 2. แสงสว่าง
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 2);
        directionalLight.position.set(5, 10, 7.5);
        scene.add(directionalLight);

        // 3. ระบบโหลดโมเดล GLB
        let currentModel = null;
        const loader = new THREE.GLTFLoader();
        const dracoLoader = new THREE.DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
        loader.setDRACOLoader(dracoLoader);

        const status = document.getElementById('status');

        function loadModel(url) {
            status.innerText = "กำลังโหลดโมเดล...";
            
            // ลบโมเดลเก่าออกก่อนถ้ามี
            if (currentModel) scene.remove(currentModel);

            loader.load(url, (gltf) => {
                currentModel = gltf.scene;

                // จัดตำแหน่งให้อยู่จุดศูนย์กลางกลางฉากพอดี
                const box = new THREE.Box3().setFromObject(currentModel);
                const center = box.getCenter(new THREE.Vector3());
                currentModel.position.sub(center);

                scene.add(currentModel);
                status.innerText = "โหลดโมเดลสำเร็จ!";
            }, (xhr) => {
                if (xhr.total > 0) {
                    status.innerText = `กำลังโหลด... ${Math.round((xhr.loaded / xhr.total) * 100)}%`;
                }
            }, (error) => {
                console.error(error);
                status.innerText = "เกิดข้อผิดพลาดในการโหลดโมเดล (ตรวจสอบลิงก์อีกครั้ง)";
            });
        }

        // กดปุ่มเพื่อโหลด
        document.getElementById('load-btn').addEventListener('click', () => {
            const url = document.getElementById('github-url-input').value;
            if (url) loadModel(url);
        });

        // โหลดโมเดล Shushi.glb ทันทีเมื่อเปิดหน้าเว็บ
        loadModel(document.getElementById('github-url-input').value);

        // 4. Loop Render
        function animate() {
            controls.update();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
